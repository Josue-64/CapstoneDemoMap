<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        <style>
        html, body {
            background-color: #ffffff;
        }
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        } 
        </style>

        <style>
        #map {
            width: 1140px;
            height: 761px;
        }

        /* Popup box */
        .ol-popup {
        background: #ffffff;
        border: none;
        border-radius: 14px;
        padding: 18px 20px;
        min-width: 260px;
        max-width: 340px;
        font-family: "Segoe UI", system-ui, Arial, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        color: #2b2b36;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12), 0 2px 6px rgba(0, 0, 0, 0.08);
        animation: popup-in 0.18s ease-out;
        }

        @keyframes popup-in {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
        }

        /* Arrow: match the box, remove the outline arrow */
        .ol-popup:after  { border-top-color: #ffffff; }
        .ol-popup:before { border-top-color: transparent; }

        /* Close button: small, round, subtle */
        .ol-popup-closer {
        top: 10px;
        right: 10px;
        width: 24px;
        height: 24px;
        line-height: 24px;
        text-align: center;
        border-radius: 50%;
        color: #8a8a99;
        text-decoration: none;
        transition: background 0.15s, color 0.15s;
        }
        .ol-popup-closer:hover {
        background: #f1f1f4;
        color: #dd840f;
        }

        /* Content */
        #popup-content {
        padding-right: 18px;   /* keeps text clear of the close button */
        }
        #popup-content table {
        width: 100%;
        border-collapse: collapse;
        }
        #popup-content td,
        #popup-content th {
        padding: 6px 0;
        border: none;
        border-bottom: 1px solid #f0f0f3;
        text-align: left;
        vertical-align: top;
        }
        #popup-content tr:last-child td,
        #popup-content tr:last-child th {
        border-bottom: none;
        }
        /* Labels (first column) lighter, values darker */
        #popup-content td:first-child,
        #popup-content th {
        color: #8a8a99;
        font-weight: 600;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding-right: 12px;
        white-space: nowrap;
        }
        #popup-content a {
        color: #dd840f;
        text-decoration: none;
        }
        #popup-content a:hover { text-decoration: underline; }
        
        </style>
        <title>Demo Map</title>
    </head>
    <body>
        <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>
        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>
        <script src="layers/DEMO11Marylandpgmc_county_overburdened_underserved_cleaned_1.js"></script><script src="layers/DEMO11CommunityStewardship_2.js"></script><script src="layers/DEMO11YouthPrograms_3.js"></script><script src="layers/DEMO11LandscapingTraining_4.js"></script>
        <script src="styles/DEMO11Marylandpgmc_county_overburdened_underserved_cleaned_1_style.js"></script><script src="styles/DEMO11CommunityStewardship_2_style.js"></script><script src="styles/DEMO11YouthPrograms_3_style.js"></script><script src="styles/DEMO11LandscapingTraining_4_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>
    </body>
</html>
